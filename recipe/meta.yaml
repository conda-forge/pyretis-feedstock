{% set name = "pyretis" %}
{% set version = "3.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5e05f2dd091f9fabfe44a6a2a232d945764b9bd2bc9318d9efeae381930f8e8f

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv


requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools
    - cython
    - numpy
    - zlib
  run:
    - python
    - cython
    - sphinx
    - sphinx_bootstrap_theme
    - setuptools
    - {{ pin_compatible('numpy') }}
    - scipy
    - pandas
    - pytables
    - zlib
    - colorama
    - tqdm
    - docutils
    - matplotlib-base
    - jinja2
    - mdtraj

test:
  imports:
    - pyretis

about:
  home: http://www.pyretis.org
  license: LGPL-2.1-or-later
  license_file: LICENSE
  summary: 'PyRETIS: A well-done, medium-sized python library for rare events, DOI: 10.1002/jcc.24900'

extra:
  recipe-maintainers:
    - EnricoRiccardi
    - andersle
    - sroet
